<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeviceHub</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- The same night arena as BoostOS, without the pitch: one resting floodlight. -->
  <div class="stage" aria-hidden="true">
    <div class="flood flood-a"></div>
    <div class="flood flood-b"></div>
  </div>

  <header class="topbar">
    <div class="wordmark">DeviceHub</div>
    <div class="topbar-status">
      <span id="pad-status" class="chip"></span>
      <time id="clock"></time>
      <button class="round-btn" id="settings-btn" data-nav data-sfx="none"></button>
      <button class="round-btn power" id="power-btn" data-nav data-sfx="none"></button>
    </div>
  </header>

  <main class="screen">
    <section class="block">
      <div class="block-head">
        <h2 id="dev-title"></h2>
        <span class="head-meta" id="dev-meta"></span>
        <button class="btn small" id="refresh-btn" data-nav></button>
      </div>
      <div class="devices" id="devices"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2 id="snd-title"></h2>
        <span class="head-meta" id="snd-meta"></span>
      </div>
      <div class="snd-group">
        <h3 id="out-title"></h3>
        <div class="snd-row" id="outputs"></div>
      </div>
      <div class="snd-group">
        <h3 id="in-title"></h3>
        <div class="snd-row" id="inputs"></div>
      </div>
    </section>
  </main>

  <aside class="signature"><span>Made by Hananel Sabag</span></aside>
  <footer class="hints" id="hints"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
